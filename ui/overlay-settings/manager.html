<div class="overlay-manager">
  <h2 class="mode-title" id="overlay-mode-title">모드 선택</h2>
  <div class="mode-tabs" role="group" aria-labelledby="overlay-mode-title">
    <button type="button" data-mode="1" aria-pressed="false"><span aria-hidden="true">✥</span> 수정</button>
    <button type="button" data-mode="2" aria-pressed="false"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 3v15l4-4 3.5 7 3-1.5L12 12h6z"/></svg> 상호작용</button>
    <button type="button" data-mode="0" aria-pressed="false"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg> 고정</button>
  </div>
  <p class="mode-desc" id="overlay-mode-desc">위치·크기 조절 (투명)</p>
  <section class="source-panel" aria-labelledby="sources-title">
    <div class="source-header">
      <h2 id="sources-title">소스</h2>
      <div class="layout-toggle" role="group" aria-label="소스 목록 배치">
        <button type="button" data-layout="1" aria-pressed="true" title="1열 배치">1열</button>
        <button type="button" data-layout="2" aria-pressed="false" title="2열 배치">2열</button>
      </div>
    </div>
    <div id="layers" data-columns="1"></div>
    <div class="source-tools" role="group" aria-label="소스 작업">
      <button class="source-tool-icon" id="add" type="button" aria-label="추가" title="추가" aria-haspopup="dialog" aria-controls="overlay-editor"><span aria-hidden="true">＋</span></button>
      <button class="source-tool-icon" id="remove" type="button" aria-label="삭제" title="삭제"><span aria-hidden="true">🗑︎</span></button>
      <button class="source-tool-icon" id="properties" type="button" aria-label="수정" title="수정" aria-haspopup="dialog" aria-controls="overlay-editor"><span aria-hidden="true">⚙︎</span></button>
      <span class="tool-spacer"></span>
      <button id="up" type="button" title="앞으로 이동" aria-label="앞으로 이동">↑</button>
      <button id="down" type="button" title="뒤로 이동" aria-label="뒤로 이동">↓</button>
    </div>
  </section>
  <p id="status" role="status"></p>
  <dialog id="overlay-editor" aria-labelledby="editor-title">
    <form id="editor" autocomplete="off">
      <h2 id="editor-title">소스 설정</h2>
      <label>이름<input name="name" autocomplete="off" maxlength="80" required placeholder="예: 방송 알림" autofocus></label>
      <label>URL<input name="url" autocomplete="off" type="url" maxlength="4096" placeholder="https://example.com/widget"></label>
      <label class="login-link">
        <input class="chzzk-checkbox-input" type="checkbox" name="linkLogin" checked>
        로그인 연동
      </label>
      <details class="custom-css" id="custom-css">
        <summary>커스텀 CSS</summary>
        <div class="css-mode-tabs" role="tablist" aria-label="모드별 커스텀 CSS">
          <button type="button" role="tab" data-css-tab="arrange" aria-selected="true">수정</button>
          <button type="button" role="tab" data-css-tab="interact" aria-selected="false">상호작용</button>
          <button type="button" role="tab" data-css-tab="pass" aria-selected="false">고정</button>
        </div>
        <p class="css-help" data-css-help="arrange">수정 모드 전용 (미입력 시 기본 투명)</p>
        <p class="css-help" data-css-help="interact" hidden>상호작용 모드 전용 (미입력 시 기본 스타일)</p>
        <p class="css-help" data-css-help="pass" hidden>고정 모드 전용 (미입력 시 기본 투명)</p>
        <textarea name="cssArrange" data-css-pane="arrange" aria-label="수정 모드 커스텀 CSS" rows="5" spellcheck="false" placeholder="/* 예시: 수정 모드 폰트·그림자 */&#10;[class*=&quot;_chatting_message_&quot;] {&#10;  font-size: 15px;&#10;  text-shadow: 0 1px 4px #000;&#10;}"></textarea>
        <textarea name="cssInteract" data-css-pane="interact" aria-label="상호작용 모드 커스텀 CSS" rows="5" spellcheck="false" placeholder="/* 예시: 상호작용 모드 줄간격·배경 */&#10;[class*=&quot;_chatting_message_&quot;] {&#10;  line-height: 1.5;&#10;}" hidden></textarea>
        <textarea name="cssPass" data-css-pane="pass" aria-label="고정 모드 커스텀 CSS" rows="5" spellcheck="false" placeholder="/* 예시: 방송 송출용 투명·강조 스타일 */&#10;html, body { background: transparent !important; }&#10;[class*=&quot;_chatting_message_&quot;] { text-shadow: 0 2px 4px rgba(0,0,0,0.9); }" hidden></textarea>
      </details>
      <details class="appearance" id="appearance-settings">
        <summary>크기 · 배경 설정</summary>
        <div class="appearance-body">
          <label for="chat-scale">채팅 크기 <output id="chat-scale-value">100%</output></label>
          <input name="chatScale" id="chat-scale" type="range" min="100" max="170" step="5" value="100">
          <label>배경 색상<input type="color" name="backgroundColor" id="background-color" value="#141517"></label>
          <label for="window-opacity">창 전체 <output id="window-opacity-value">100%</output></label>
          <input name="windowOpacity" id="window-opacity" type="range" min="0" max="100" value="100">
          <label for="donation-opacity">후원 메시지 배경 <output id="donation-opacity-value">100%</output></label>
          <input name="donationBackgroundOpacity" id="donation-opacity" type="range" min="0" max="100" value="100">
          <label for="background-opacity">배경 <output id="background-opacity-value">0%</output></label>
          <input name="backgroundOpacity" id="background-opacity" type="range" min="0" max="100" value="0">
        </div>
      </details>
      <p id="editor-status" role="status" hidden></p>
      <div class="actions"><button type="button" id="cancel">취소</button><button class="primary" type="submit">저장</button></div>
    </form>
  </dialog>
</div>
