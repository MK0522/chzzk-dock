name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Dependencies
        run: go mod download

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Generate PE Resource
        run: go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@latest -64 -o resource_windows_amd64.syso

      - name: Build Windows Executable
        run: go build -trimpath -ldflags="-H windowsgui" -o chzzk-dock.exe .

      - name: Build Inno Setup Installer
        run: |
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
          } else {
            throw "ISCC compiler not found"
          }

      - name: Prepare Release Notes
        id: release_notes
        shell: pwsh
        run: .\scripts\prepare_release_notes.ps1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.release_notes.outputs.release_title }}
          body_path: ${{ steps.release_notes.outputs.has_custom_notes == 'true' && 'release_body.md' || '' }}
          # 릴리즈 에셋은 인스톨러 단일 배포 유지 (설치 혼동 및 자동 업데이트 오다운로드 방지)
          # 단일 실행 바이너리(chzzk-dock.exe)가 필요한 사용자는 직접 소스 빌드하여 사용
          files: chzzk-dock-setup.exe
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, '-') }}
          generate_release_notes: ${{ steps.release_notes.outputs.has_custom_notes != 'true' }}
